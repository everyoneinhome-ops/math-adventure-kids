<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Adventure Kids</title>
<style>
:root{--ink:#24324a;--paper:#fffdf7;--card:#ffffff;--soft:#eef6ff;--accent:#5b7cfa;--good:#31a66a;--bad:#e85b62}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff3d8,#eaf7ff);color:var(--ink)}
header{padding:22px 18px;text-align:center;background:#ffffffcc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:clamp(30px,6vw,52px)} header p{margin:7px 0 0;font-size:18px}
.wrap{max-width:1100px;margin:auto;padding:18px}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 18px}
button,select{font:inherit;border:0;border-radius:16px;padding:12px 16px;cursor:pointer;background:white;box-shadow:0 4px 12px #24324a18;color:var(--ink)}
button:hover{transform:translateY(-1px)} .topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.topic{min-height:110px;font-weight:bold;font-size:17px}.topic span{display:block;font-size:36px;margin-bottom:7px}
.topic.active{outline:4px solid #9eb1ff;background:#f3f5ff}
.game{margin-top:18px;background:var(--card);border-radius:28px;padding:24px;box-shadow:0 10px 35px #24324a1a;text-align:center}
.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:var(--soft);font-weight:bold}
.question{font-size:clamp(34px,8vw,66px);font-weight:800;margin:24px 0 18px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(100px,1fr));gap:12px;max-width:560px;margin:auto}
.answer{font-size:28px;background:#f7f9ff;padding:20px}.answer.correct{background:#dff8e9;color:#17683f}.answer.wrong{background:#ffe2e4;color:#8a2228}
.feedback{min-height:30px;margin:18px 0;font-size:21px;font-weight:bold}.progress{height:12px;background:#e8edf7;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:.3s}
.stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:14px 0;font-weight:bold}.hidden{display:none}
footer{text-align:center;padding:28px 12px;opacity:.75;font-size:14px}
@media(max-width:500px){.answers{grid-template-columns:1fr 1fr}.game{padding:17px}.answer{font-size:23px}}
</style>
</head>
<body>
<header>
<h1>🌈 Math Adventure Kids</h1>
<p>Learn • Play • Practice • Celebrate! 🎉</p>
</header>
<div class="wrap">
<div class="controls">
<label>Age / Level:
<select id="level">
<option value="3">Age 3–4 • Pre-K</option>
<option value="5">Age 5–6 • K–1</option>
<option value="7">Age 7–8 • Grades 2–3</option>
<option value="9">Age 9–10 • Grades 4–5</option>
</select></label>
<button onclick="newQuestion()">🎲 New Question</button>
<button onclick="resetScore()">🔄 Reset</button>
</div>

<div class="topic-grid" id="topics"></div>

<section class="game">
<div class="badge" id="topicName">Counting</div>
<div class="question" id="question">⭐ ⭐ ⭐</div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="stats"><span>⭐ Score: <b id="score">0</b></span><span>🔥 Streak: <b id="streak">0</b></span><span>🏆 Best: <b id="best">0</b></span></div>
</section>
</div>
<footer>Free, kid-friendly practice • No account required • Works offline in a browser</footer>

<script>
const topics=[
["count","🔢","Counting"],["add","➕","Addition"],["sub","➖","Subtraction"],
["mul","✖️","Multiplication"],["div","➗","Division"],["frac","🍕","Fractions"],
["dec","🔵","Decimals"],["pct","💯","Percentage"],["ratio","⚖️","Ratios"],
["shape","🔺","Shapes"],["measure","📏","Measurement"],["mixed","🌟","Mixed Math"]
];
let topic="count",score=0,streak=0,best=Number(localStorage.getItem("mathBest")||0),answered=false,correct=0,total=0;

const topicsEl=document.getElementById("topics");
topics.forEach(t=>{let b=document.createElement("button");b.className="topic"+(t[0]===topic?" active":"");b.innerHTML=`<span>${t[1]}</span>${t[2]}`;b.onclick=()=>{topic=t[0];document.querySelectorAll(".topic").forEach(x=>x.classList.remove("active"));b.classList.add("active");newQuestion()};topicsEl.appendChild(b)});

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function level(){return Number(document.getElementById("level").value)}
function makeQuestion(){
 let L=level(),a,b,ans,text;
 if(topic==="count"){let n=rand(1,L<=4?10:L<=6?20:50);return {q:"How many? "+("⭐ ".repeat(n)),a:n}}
 if(topic==="add"){let max=L<=4?5:L<=6?10:L<=8?50:100;a=rand(0,max);b=rand(0,max);return {q:`${a} + ${b} = ?`,a:a+b}}
 if(topic==="sub"){let max=L<=4?5:L<=6?15:L<=8?60:100;a=rand(0,max);b=rand(0,a);return {q:`${a} − ${b} = ?`,a:a-b}}
 if(topic==="mul"){let max=L<=6?5:L<=8?10:12;a=rand(0,max);b=rand(0,max);return {q:`${a} × ${b} = ?`,a:a*b}}
 if(topic==="div"){let d=rand(1,L<=6?5:12),ans=rand(0,L<=6?5:12),n=d*ans;return {q:`${n} ÷ ${d} = ?`,a:ans}}
 if(topic==="frac"){let d=rand(2,L<=6?6:12),n=rand(1,d-1);return {q:`Which fraction is ${n}/${d}?`,a:`${n}/${d}`}}
 if(topic==="dec"){let n=rand(1,99), ans=(n/10).toFixed(1);return {q:`${n}/10 = ?`,a:ans}}
 if(topic==="pct"){let p=[10,20,25,50,75][rand(0,4)],n=[20,40,60,80,100][rand(0,4)];let ans=n*p/100;return {q:`${p}% of ${n} = ?`,a:ans}}
 if(topic==="ratio"){let x=rand(1,5),k=rand(2,5);return {q:`The ratio ${x*k}:${k} simplifies to ?`,a:`${x}:1`}}
 if(topic==="shape"){let items=[["🔺","triangle"],["⬜","square"],["▭","rectangle"],["⚪","circle"]];let s=items[rand(0,3)];return {q:`What shape is ${s[0]}?`,a:s[1]}}
 if(topic==="measure"){let n=rand(1,10);return {q:`${n} meters = ? centimeters`,a:n*100}}
 return mixedQuestion();
}
function mixedQuestion(){let ts=["add","sub","mul","div"];topic=ts[rand(0,3)];return makeQuestion()}

function options(ans){
 let vals=[String(ans)];let tries=0;
 while(vals.length<4&&tries++<50){let x;
  if(typeof ans==="number") x=String(ans+rand(-10,10));
  else if(typeof ans==="string"&&ans.includes("/")){let [n,d]=ans.split("/").map(Number);x=`${Math.max(1,n+rand(-2,2))}/${d}`}
  else x=String(rand(1,10));
  if(!vals.includes(x))vals.push(x);
 }
 return vals.sort(()=>Math.random()-.5);
}
function newQuestion(){
 answered=false;document.getElementById("feedback").textContent="";
 let q=makeQuestion();correct=q.a;document.getElementById("topicName").textContent=topics.find(x=>x[0]===topic)[2];document.getElementById("question").innerHTML=q.q;
 let box=document.getElementById("answers");box.innerHTML="";
 options(correct).forEach(v=>{let b=document.createElement("button");b.className="answer";b.textContent=v;b.onclick=()=>check(v,b);box.appendChild(b)});
}
function check(v,b){
 if(answered)return;answered=true;total++;
 let ok=String(v)===String(correct);
 document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
 if(ok){score+=10;streak++;best=Math.max(best,streak);b.classList.add("correct");document.getElementById("feedback").textContent=["🎉 Great job!","🌟 Amazing!","👏 You got it!","🚀 Math superstar!"][rand(0,3)]}
 else{streak=0;b.classList.add("wrong");document.getElementById("feedback").textContent=`💡 Try again! The answer is ${correct}.`}
 document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak;document.getElementById("best").textContent=best;document.getElementById("bar").style.width=((total%10)*10||10)+"%";localStorage.setItem("mathBest",best);
 setTimeout(newQuestion,900);
}
function resetScore(){score=0;streak=0;total=0;document.getElementById("score").textContent=0;document.getElementById("streak").textContent=0;document.getElementById("bar").style.width="0%";newQuestion()}
document.getElementById("level").onchange=newQuestion;
document.getElementById("best").textContent=best;newQuestion();
</script>
</body>
</html>
